name: Finlyt CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================================================
  # CI - BUILD, TEST, DOCKER & SECURITY
  # =========================================================
  build-test:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: bankappdb

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ secrets.MYSQL_ROOT_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Java
      # -----------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------------------
      # Maven
      # -----------------------------------------------------
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      # -----------------------------------------------------
      # Build & Test
      # -----------------------------------------------------
      - name: Build and test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: bankappdb
          MYSQL_USER: root
          MYSQL_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: mvn clean verify

      # -----------------------------------------------------
      # Docker Build
      # -----------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t guddu3447/finlyt:${{ github.sha }} .

      # -----------------------------------------------------
      # Trivy Security Scan
      # -----------------------------------------------------
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guddu3447/finlyt:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # -----------------------------------------------------
      # Docker Hub Login
      # -----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------
      # Push Docker Image
      # -----------------------------------------------------
      - name: Push Docker image
        run: |
          docker tag guddu3447/finlyt:${{ github.sha }} guddu3447/finlyt:latest

          docker push guddu3447/finlyt:${{ github.sha }}

          docker push guddu3447/finlyt:latest


  # =========================================================
  # CD - DEPLOY TO LOCAL KIND KUBERNETES
  # =========================================================
  deploy:
    name: Deploy to Kubernetes
    needs: build-test

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # -----------------------------------------------------
      # Checkout Repository
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Configure Kubeconfig
      # -----------------------------------------------------
      - name: Configure Kubernetes
        shell: powershell
        run: |
          $env:KUBECONFIG = "C:\actions-runner\kubeconfig"

          Write-Host "KUBECONFIG: $env:KUBECONFIG"

          kubectl config current-context

          kubectl get nodes

      # -----------------------------------------------------
      # Verify Kubernetes
      # -----------------------------------------------------
      - name: Check Kubernetes
        shell: powershell
        env:
          KUBECONFIG: C:\actions-runner\kubeconfig
        run: |
          Write-Host "Checking Kubernetes..."

          kubectl version --client

          kubectl config current-context

          kubectl get nodes

          kubectl get pods

      # -----------------------------------------------------
      # Install Helm
      # -----------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      # -----------------------------------------------------
      # Verify Helm
      # -----------------------------------------------------
      - name: Check Helm
        shell: powershell
        env:
          KUBECONFIG: C:\actions-runner\kubeconfig
        run: |
          Write-Host "Checking Helm..."

          helm version

          helm lint helm

          helm template finlyt helm

      # -----------------------------------------------------
      # Deploy with Helm
      # -----------------------------------------------------
      - name: Deploy with Helm
        shell: powershell
        env:
          KUBECONFIG: C:\actions-runner\kubeconfig
        run: |
          Write-Host "Deploying Finlyt with Helm..."

          helm upgrade --install finlyt helm `
            --namespace default `
            --create-namespace

      # -----------------------------------------------------
      # Wait for Finlyt rollout
      # -----------------------------------------------------
      - name: Wait for Finlyt rollout
        shell: powershell
        env:
          KUBECONFIG: C:\actions-runner\kubeconfig
        run: |
          kubectl rollout status deployment/finlyt --timeout=180s

          kubectl rollout status deployment/finlyt-mysql --timeout=180s

      # -----------------------------------------------------
      # Verify Deployment
      # -----------------------------------------------------
      - name: Verify deployment
        shell: powershell
        env:
          KUBECONFIG: C:\actions-runner\kubeconfig
        run: |
          Write-Host "=============================="
          Write-Host "DEPLOYMENT VERIFICATION"
          Write-Host "=============================="

          Write-Host ""
          Write-Host "Pods:"
          kubectl get pods -o wide

          Write-Host ""
          Write-Host "Services:"
          kubectl get svc

          Write-Host ""
          Write-Host "HPA:"
          kubectl get hpa

          Write-Host ""
          Write-Host "Deployments:"
          kubectl get deployments

          Write-Host ""
          Write-Host "Helm:"
          helm list

          Write-Host ""
          Write-Host "Finlyt deployment completed successfully!"